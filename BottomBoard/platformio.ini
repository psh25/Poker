; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = bodmer/TFT_eSPI

; 根据你们模组实际容量改
board_build.flash_size = 16MB
; board_build.arduino.memory_type = qio_opi   ; 复位循环排查：临时注释（按模组型号恢复）
; board_build.partitions = default_16MB.csv   ; 复位循环排查：临时注释

; 如果模组带PSRAM（N16R8就是8MB PSRAM），加上这行
build_flags = 
    ; ---- TFT_eSPI：1.8" ST7735 128x160（引脚见 pins_config.h / 架构 v2 1.3）----
    -DUSER_SETUP_LOADED=1
    -DUSE_FSPI_PORT=1
    -DST7735_DRIVER=1
    -DST7735_REDTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_CS=47
    -DTFT_DC=14
    -DTFT_RST=21
    -DTFT_MOSI=13
    -DTFT_SCLK=12
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=10000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DTFT_SPI_MODE=3
