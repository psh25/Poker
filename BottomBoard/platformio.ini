[env:esp32-s3-devkitc-1]
; 固定在 espressif32 6.9.0（Arduino-ESP32 core 2.0.17）：
; TMCStepper 0.7.3 在 core 3.x 下硬件 UART 通信失效（teemuatlut/TMCStepper#302），
; 导致 TMC2209 的 IHOLD/IRUN 无法写入；若升级平台需先验证驱动 UART 可用。
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	bodmer/TFT_eSPI
	waspinator/AccelStepper@^1.64
	teemuatlut/TMCStepper@^0.7.3
board_build.flash_size = 16MB
build_flags = 
	-DUSER_SETUP_LOADED=1
	-DUSE_FSPI_PORT=1
	-DST7735_DRIVER=1
	-DST7735_REDTAB=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_CS=47
	-DTFT_DC=14
	-DTFT_RST=21
	-DTFT_MOSI=13
	-DTFT_SCLK=12
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=10000000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DTFT_SPI_MODE=3
