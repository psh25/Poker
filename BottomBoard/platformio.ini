; PlatformIO Project Configuration File
;
; BottomBoard - 发牌机底板
; 2026-09-09 迁移：主控由 ESP32-S3-DevKitC-1 换为经典 ESP32 (ESP32 Dev Module / esp32dev)
;   - Flash 4MB(DIO) / 921600 / CH9102(COM12)
;   - 屏幕 ST7735 128x160: CS18 DC21 RST19 MOSI22 SCLK23
;   - 其他外设引脚见 include/pins_config.h（TMC/霍尔/编码器/滑环串口；SD 预留未接）

[env:esp32-s3-devkitc-1]
; 环境名沿用旧名以复用本地 libdeps；board 已改为经典 ESP32
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM12
monitor_port = COM12
upload_speed = 921600
lib_deps = 
	bodmer/TFT_eSPI
	waspinator/AccelStepper@^1.64
board_build.flash_size = 4MB
build_flags = 
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_REDTAB=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_CS=18
	-DTFT_DC=21
	-DTFT_RST=19
	-DTFT_MOSI=22
	-DTFT_SCLK=23
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=10000000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DTFT_SPI_MODE=3
